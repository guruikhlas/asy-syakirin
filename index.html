<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Masjid Asy-Syakirin - Februari</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark-green: #064e3b; --gold: #d4af37; --gold-light: #f3e5ab; }
        body {
            font-family: 'Poppins', sans-serif; background-color: var(--dark-green);
            background-image: url('https://www.transparenttextures.com/patterns/arabesque.png');
            color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .main-card {
            width: 100%; max-width: 500px; border: 2px solid var(--gold); border-radius: 25px;
            background: rgba(6, 78, 59, 0.95); padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center; backdrop-filter: blur(10px);
        }
        .logo-circle {
            width: 120px; height: 120px; background: white; border-radius: 50%;
            margin: -75px auto 15px; display: flex; align-items: center; justify-content: center;
            border: 4px solid var(--gold); overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-family: 'Amiri', serif; color: var(--gold); margin: 5px 0; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .sub-header { font-size: 0.75rem; letter-spacing: 1px; color: var(--gold-light); margin-bottom: 15px; }
        .clock-box {
            background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold);
            border-radius: 15px; padding: 10px 20px; margin-bottom: 20px;
        }
        #live-time { font-size: 1.8rem; font-weight: bold; color: var(--gold); display: block; }
        #live-date { font-size: 0.9rem; color: var(--gold-light); }
        
        #detail-view {
            margin-top: 10px; padding: 20px; border-radius: 20px;
            background: #fff; color: #333; display: none; box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        .khatib-header {
            background: linear-gradient(135deg, var(--gold), #b8860b);
            color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-weight: bold;
        }
        .row-detail {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid #eee;
        }
        .label-sholat { font-weight: 600; color: var(--dark-green); font-size: 0.85rem; }
        .waktu-angka { color: #888; font-size: 0.8rem; margin-left: 5px; font-weight: 400; }
        .nama-imam { text-align: right; flex: 1; margin-left: 10px; font-size: 0.9rem; font-weight: 600; }

        .date-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 25px; width: 100%; }
        .date-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--gold);
            color: var(--gold-light); padding: 10px 5px; border-radius: 12px;
            cursor: pointer; transition: 0.3s; font-size: 0.7rem;
        }
        .date-btn span { display: block; font-weight: bold; font-size: 0.9rem; }
        .date-btn:hover, .date-btn.active { background: var(--gold); color: var(--dark-green); }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-circle">
            <img src="logo asy_syakirin.jpeg" alt="Logo Asy-Syakirin">
        </div>
        <h1>MASJID ASY-SYAKIRIN</h1>
        <div class="sub-header">Percut Sei Tuan, Deli Serdang, Sumatera Utara</div>

        <div class="clock-box">
            <span id="live-time">00:00:00</span>
            <span id="live-date">Memuat Hari...</span>
        </div>

        <div id="detail-view"></div>

        <p style="font-size: 0.7rem; color: var(--gold-light); margin-top: 20px;">PILIH TANGGAL (FEBRUARI 2026):</p>
        <div class="date-grid" id="date-buttons"></div>
    </div>

    <script>
    const imams = ["SURIANTO, B.Sc", "CITRA DHARMA PRAYOGO, S.Kom", "MAWARDI NUR, S.Pd", "NUHBAH PADANG, S.Pd", "MUHAMMAD YUDI ASHARI", "ZULKARNAIN"];
    
    // Data Khatib Jumat Februari 2026 - SUDAH DIPERBAIKI
    const khatibs = { 
        "06": "Ust. Ruslan, S.Ag.", 
        "13": "Ust. Khoiruddin Daulay, S.Pd.I", 
        "20": "Ust. Abi Sanjaya, S.Pd.I", 
        "27": "Ust. Fahruddin, S.Pd." 
    };

    const prayerTimes = {
        start: { sub: "05:28", zuh: "12:41", ash: "16:01", mag: "18:41", isy: "19:53" },
        end: { sub: "05:25", zuh: "12:40", ash: "15:58", mag: "18:42", isy: "19:53" }
    };

    const scheduleMatrix = {
        "01": [1, 2, 3, 4, 5], "02": [6, 1, 2, 3, 4], "03": [5, 6, 1, 2, 3], "04": [4, 5, 6, 1, 2], "05": [3, 4, 5, 6, 1], 
        "06": [2, 0, 4, 5, 6], "07": [1, 2, 3, 4, 5], "08": [6, 1, 2, 3, 4], "09": [5, 6, 1, 2, 3], "10": [4, 5, 6, 1, 2],
        "11": [3, 4, 5, 6, 1], "12": [2, 3, 4, 5, 6], "13": [1, 0, 3, 4, 5], "14": [6, 1, 2, 3, 4], "15": [5, 6, 1, 2, 3],
        "16": [4, 5, 6, 1, 2], "17": [3, 4, 5, 6, 1], "18": [2, 3, 4, 5, 6], "19": [1, 2, 3, 4, 5], "20": [6, 0, 2, 3, 4],
        "21": [5, 6, 1, 2, 3], "22": [4, 5, 6, 1, 2], "23": [3, 4, 5, 6, 1], "24": [2, 3, 4, 5, 6], "25": [1, 2, 3, 4, 5],
        "26": [6, 1, 2, 3, 4], "27": [5, 0, 1, 2, 3], "28": [4, 5, 6, 1, 2]
    };

    function getWaktu(tipe, tgl) {
        const factor = (tgl - 1) / 27;
        const startStr = prayerTimes.start[tipe].split(':');
        const endStr = prayerTimes.end[tipe].split(':');
        const startMin = parseInt(startStr[0]) * 60 + parseInt(startStr[1]);
        const endMin = parseInt(endStr[0]) * 60 + parseInt(endStr[1]);
        const currentMin = Math.floor(startMin + (endMin - startMin) * factor);
        return `${Math.floor(currentMin/60).toString().padStart(2,'0')}:${(currentMin%60).toString().padStart(2,'0')}`;
    }

    function generateCalendar() {
        const grid = document.getElementById('date-buttons');
        if (!grid) return;
        grid.innerHTML = ''; // Bersihkan grid sebelum isi ulang

        const daysName = ["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"];
        const skrg = new Date();
        const tglHariIni = skrg.getDate();
        const bulanHariIni = skrg.getMonth(); 

        for (let i = 1; i <= 28; i++) {
            const date = new Date(2026, 1, i);
            const dayLabel = daysName[date.getDay()];
            const dayStr = i.toString().padStart(2, '0');
            const btn = document.createElement('button');
            btn.className = 'date-btn';
            btn.id = `btn-tgl-${i}`; 
            btn.innerHTML = `${dayLabel} <span>${dayStr}</span>`;
            btn.onclick = () => {
                document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                showDetail(dayStr, dayLabel);
            };
            grid.appendChild(btn);
        }

        // OTOMATIS BUKA JADWAL HARI INI
        // Karena sekarang tanggal 4 Feb 2026, ini akan otomatis membuka tanggal 4
        if (bulanHariIni === 1 && tglHariIni <= 28) {
            const el = document.getElementById(`btn-tgl-${tglHariIni}`);
            if(el) el.click();
        } else {
            const el = document.getElementById('btn-tgl-1');
            if(el) el.click();
        }
    }

    function showDetail(dayStr, dayLabel) {
        const view = document.getElementById('detail-view');
        const codes = scheduleMatrix[dayStr];
        const khatib = khatibs[dayStr];
        const isJumat = (dayLabel === "Jum");

        let html = `<h3 style="margin-top:0; color:var(--dark-green); border-bottom:2px solid var(--gold); padding-bottom:10px;">Jadwal ${dayLabel}, ${dayStr} Feb 2026</h3>`;

        if (isJumat && khatib) {
            html += `<div class="khatib-header"><i class="fas fa-mosque"></i> KHATIB / IMAM JUM'AT:<br><span style="font-size:1.1rem">${khatib}</span></div>`;
        }

        const prayers = [
            { id: 'sub', n: 'Subuh', icon: 'cloud-sun' },
            { id: 'zuh', n: 'Zuhur', icon: 'sun' },
            { id: 'ash', n: 'Ashar', icon: 'cloud-sun-rain' },
            { id: 'mag', n: 'Maghrib', icon: 'moon' },
            { id: 'isy', n: 'Isya', icon: 'cloud-moon' }
        ];

        prayers.forEach((p, idx) => {
            if (isJumat && p.id === 'zuh') return;
            const imamIndex = codes[idx] - 1;
            const imamName = (imamIndex >= 0) ? imams[imamIndex] : "—";
            html += `
                <div class="row-detail">
                    <span class="label-sholat"><i class="fas fa-${p.icon}"></i> ${p.n} <span class="waktu-angka">${getWaktu(p.id, parseInt(dayStr))}</span></span>
                    <span class="nama-imam">${imamName}</span>
                </div>`;
        });

        view.innerHTML = html;
        view.style.display = 'block';
    }

    function updateClock() {
        const now = new Date();
        const timeEl = document.getElementById('live-time');
        const dateEl = document.getElementById('live-date');
        if(timeEl) timeEl.innerText = now.toLocaleTimeString('id-ID');
        if(dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    let alarmSudahBunyi = "";
    function checkAlarm() {
        const sekarang = new Date();
        if (sekarang.getMonth() !== 1) return; 

        const tglHariIni = sekarang.getDate();
        const jamSkrg = sekarang.getHours().toString().padStart(2, '0');
        const menitSkrg = sekarang.getMinutes().toString().padStart(2, '0');
        const waktuSkrgStr = `${jamSkrg}:${menitSkrg}`;
        
        const listSholat = [{id:'sub', n:'Subuh'}, {id:'zuh', n:'Zuhur'}, {id:'ash', n:'Ashar'}, {id:'mag', n:'Maghrib'}, {id:'isy', n:'Isya'}];

        listSholat.forEach(sholat => {
            const waktuSholat = getWaktu(sholat.id, tglHariIni); 
            const [jamS, menitS] = waktuSholat.split(':').map(Number);
            let totalMenitAlarm = (jamS * 60) + menitS - 15;
            const waktuAlarmStr = `${Math.floor(totalMenitAlarm/60).toString().padStart(2,'0')}:${(totalMenitAlarm%60).toString().padStart(2,'0')}`;

            if (waktuSkrgStr === waktuAlarmStr && alarmSudahBunyi !== sholat.id) {
                alert(`📢 PENGINGAT IMAM: 15 Menit lagi masuk waktu ${sholat.n} (${waktuSholat}).`);
                alarmSudahBunyi = sholat.id;
            }
        });
    }

    setInterval(updateClock, 1000);
    setInterval(checkAlarm, 1000);
    // Jalankan kalender setelah DOM siap
    window.onload = generateCalendar;
</script>
